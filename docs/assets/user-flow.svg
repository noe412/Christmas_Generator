<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">User flow</title>
  <desc id="d">Add names, optionally upload pictures, start presentation mode, start the draw, winner leaves the pool, repeat.</desc>
  <style>
    .step{fill:#fff;stroke:#b01f2c;stroke-width:2}
    .opt{fill:#fff;stroke:#1f7a4d;stroke-width:2;stroke-dasharray:6 4}
    .n{font-size:13px;font-weight:700;fill:#b01f2c}
    .t{font-size:14px;fill:#2b2b2b;font-weight:600}
    .s{font-size:11.5px;fill:#6b6b6b}
    .arrow{stroke:#6b6b6b;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker></defs>
  <rect width="1000" height="220" fill="#fff"/>
  <rect class="step" x="20" y="40" width="160" height="90" rx="12"/><text class="n" x="40" y="66">1</text><text class="t" x="100" y="90" text-anchor="middle">Add names</text><text class="s" x="100" y="110" text-anchor="middle">type or import JSON</text>
  <rect class="opt" x="215" y="40" width="160" height="90" rx="12"/><text class="n" x="235" y="66" fill="#1f7a4d">2</text><text class="t" x="295" y="90" text-anchor="middle">Upload pictures</text><text class="s" x="295" y="110" text-anchor="middle">optional slideshow</text>
  <rect class="opt" x="410" y="40" width="160" height="90" rx="12"/><text class="n" x="430" y="66" fill="#1f7a4d">3</text><text class="t" x="490" y="90" text-anchor="middle">Presentation</text><text class="s" x="490" y="110" text-anchor="middle">optional fullscreen</text>
  <rect class="step" x="605" y="40" width="160" height="90" rx="12"/><text class="n" x="625" y="66">4</text><text class="t" x="685" y="90" text-anchor="middle">Start selection</text><text class="s" x="685" y="110" text-anchor="middle">button · Enter · Space</text>
  <rect class="step" x="800" y="40" width="180" height="90" rx="12"/><text class="n" x="820" y="66">5</text><text class="t" x="890" y="90" text-anchor="middle">Winner announced</text><text class="s" x="890" y="110" text-anchor="middle">removed from the pool</text>
  <path class="arrow" d="M180 85H211"/><path class="arrow" d="M375 85H406"/><path class="arrow" d="M570 85H601"/><path class="arrow" d="M765 85H796"/>
  <path class="arrow" d="M890 130V175H685V134"/>
  <text class="s" x="787" y="194" text-anchor="middle">next round – until every name has been drawn</text>
</svg>
