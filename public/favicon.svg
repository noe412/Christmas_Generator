<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Christmas Gift Generator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4d33"/>
      <stop offset="1" stop-color="#0f2a1c"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#b01f2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe38a"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".55">
    <circle cx="44" cy="50" r="5"/><circle cx="208" cy="40" r="4"/><circle cx="222" cy="110" r="3"/>
    <circle cx="30" cy="132" r="3"/><circle cx="62" cy="214" r="4"/><circle cx="214" cy="206" r="5"/>
  </g>
  <!-- bow -->
  <path d="M128 92c-14-30-50-36-56-16-5 17 26 22 56 16z" fill="url(#gold)"/>
  <path d="M128 92c14-30 50-36 56-16 5 17-26 22-56 16z" fill="url(#gold)"/>
  <!-- lid -->
  <rect x="58" y="92" width="140" height="34" rx="8" fill="url(#box)"/>
  <!-- box -->
  <rect x="70" y="122" width="116" height="88" rx="8" fill="url(#box)"/>
  <rect x="70" y="122" width="116" height="10" fill="#000" opacity=".15"/>
  <!-- ribbon -->
  <rect x="117" y="92" width="22" height="118" fill="url(#gold)"/>
  <!-- sparkle -->
  <path d="M196 58l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffe38a"/>
